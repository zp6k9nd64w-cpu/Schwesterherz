<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">

    <meta   
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta   
        name="description"
        content="Setliste"
    >

    <title> Schwesterherz | Songliste </title>

    <link
        rel="preconnect"
        href="https://fonts.googleeapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

     <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="setlist.css"
  >
</head>

<body>
    <!-- ========================================
       HEADER
  ========================================= -->

  <header
    class="site-header"
    id="start"
  >

    <!-- Burger-Menü Button -->

    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="main-menu"
    >
      <span class="menu-label">
        Menü
      </span>

      <span
        class="menu-icon"
        aria-hidden="true"
      >
        <i></i>
        <i></i>
      </span>
    </button>


    <!-- Logo im rosa Balken -->

    <a
      href="index.html"
      class="header-logo"
      aria-label="Zur Startseite"
    >
      <img
        src="images/logo_tran.PNG"
        alt="Schwesterherz – Musik mit Herz"
      >
    </a>


    <!-- Burger-Menü -->

    <nav
      class="main-menu"
      id="main-menu"
      aria-label="Hauptnavigation"
    >

      <div class="menu-links">

        <a href="index.html">
          Startseite
          <span>01</span>
        </a>

        <a href="ueber-uns.html">
          Über uns
          <span>02</span>
        </a>

        <a href="hoerproben.html">
          Hörproben
          <span>03</span>
        </a>

        <a href="index.html#kontakt">
          Kontakt
          <span>04</span>
        </a>

        <a href="impressum.html">
          Impressum
          <span>05</span>
        </a>

        <a href="Setlist.html">
          Setliste
          <span>06</span>
        </a>

      </div>


      <!-- Logo im geöffneten Burger-Menü -->

      <div class="menu-logo">
        <img
          src="images/Logo.jpeg"
          alt="Schwesterherz – Musik mit Herz"
        >
      </div>

    </nav>

  </header>

  <main>
    <section class="setlist"
    aria-labelledby="setlist"
    >
    <ul class="liste">
        <li></li>
        <li></li>  
    </ul>
</section>
  </main>
  <script src="menu.js"></script>

</body>
